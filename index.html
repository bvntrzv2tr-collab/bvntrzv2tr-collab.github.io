<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="四级复习卡片">
<title>四级复习卡片</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 14px 40px;
    background: #F1F7FD; color: #2B3440;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
  }
  header { padding: 22px 4px 6px; }
  h1 { margin: 0; font-size: 22px; }
  h1 span { font-size: 13px; color: #7F93AD; font-weight: normal; margin-left: 6px; }
  .sub { margin: 8px 0 0; font-size: 13px; color: #4F5B6B; line-height: 1.6; }
  .picker-bar {
    margin: 14px 4px 0; display: flex; align-items: center; justify-content: space-between;
    padding: 11px 14px; background: #fff; border: 1px solid #A8C8E8; border-radius: 22px;
  }
  .picker-bar .cur { font-size: 16px; font-weight: 700; }
  .picker-bar button {
    padding: 7px 12px; font-size: 13px;
    background: #CFE3F6; color: #2B3440; border: 1px solid #A8C8E8; border-radius: 18px;
  }
  .panel { margin: 10px 4px 0; display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .panel.open { display: grid; }
  .daybtn { padding: 10px 4px; text-align: center; background: #fff; border: 1px solid #A8C8E8; border-radius: 22px; }
  .daybtn.sel { background: #2B3440; color: #fff; border-color: #2B3440; }
  .daybtn .dn { font-size: 15px; font-weight: 700; }
  .daybtn .dp { font-size: 11px; color: #7F93AD; margin-top: 3px; }
  .daybtn.sel .dp { color: #CFE3F6; }
  .progress {
    margin: 12px 4px 0; padding: 10px 14px;
    background: #CFE3F6; border: 1px solid #A8C8E8; border-radius: 22px;
    font-size: 14px; display: flex; justify-content: space-between;
  }
  .seg { margin: 12px 4px 0; display: flex; }
  .seg button {
    flex: 1; padding: 9px 0; font-size: 13px;
    background: #fff; color: #4F5B6B; border: 1px solid #A8C8E8; border-left-width: 0;
  }
  .seg button:first-child { border-left-width: 1px; border-radius: 20px 0 0 20px; }
  .seg button:last-child { border-radius: 0 20px 20px 0; }
  .seg button.on { background: #2B3440; color: #fff; border-color: #2B3440; }
  .tools { margin: 12px 4px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button {
    flex: 1; padding: 9px 0; font-size: 13px;
    background: #fff; color: #2B3440; border: 1px solid #A8C8E8; border-radius: 20px;
  }
  .tools button:active, .tools button.on { background: #CFE3F6; }
  .card {
    margin: 12px 0 0; padding: 14px 14px 12px;
    background: #fff; border: 1px solid #A8C8E8; border-radius: 24px;
  }
  .card.alt { background: #F1F7FD; }
  .word-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; }
  .no {
    flex: none; width: 20px; height: 20px; line-height: 20px; text-align: center;
    background: #CFE3F6; border-radius: 50%; font-size: 11px; color: #2B3440;
  }
  .word { font-size: 19px; font-weight: 700; }
  .meaning {
    margin: 10px 0 0 28px; font-size: 15px; line-height: 1.6; color: #4F5B6B;
    display: none;
  }
  .card.open .meaning { display: block; }
  /* 方框左对齐放左边, 不再有虚线提示框 */
  .ticks { margin: 12px 0 0 28px; display: flex; align-items: center; gap: 12px; justify-content: flex-start; }
  .box {
    width: 42px; height: 42px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1.5px solid #7F93AD; border-radius: 50%; background: #fff;
    font-size: 22px; line-height: 1; color: #fff; user-select: none;
  }
  .box.on { background: #2FA15C; border-color: #2FA15C; }
  .box.no { background: #B3402F; border-color: #B3402F; }
  .star { margin-left: auto; font-size: 30px; line-height: 1; color: #C9CED6; user-select: none; flex: none; }
  .star.on { color: #E8A100; }
  .foot { margin: 20px 4px 0; font-size: 12px; color: #7F93AD; line-height: 1.7; }
  .empty { margin: 30px 4px; text-align: center; color: #7F93AD; font-size: 14px; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>四级复习卡片<span>点卡片出中文 · 方框标会 / 不会 · ★ 收藏</span></h1>
  <p class="sub">点卡片弹出中文，先在心里答、再点开对答案；方框每过一遍标一次：✓ 会（绿）/ ✗ 不会（红）；点 ★ 收藏重点词。</p>
</header>
<div class="picker-bar"><span class="cur" id="curDay"></span><button id="btnPicker">▽ 切换 Day</button></div>
<div class="panel" id="panel"></div>
<div class="progress"><span id="pTicks"></span><span id="pDone"></span></div>
<div class="seg">
  <button id="btnF0" class="on">全部</button>
  <button id="btnF1">只看不会</button>
  <button id="btnF2">只看星标</button>
</div>
<div class="tools">
  <button id="btnShuffle">打乱顺序</button>
  <button id="btnRestore">恢复顺序</button>
  <button id="btnHide">全部收起中文</button>
  <button id="btnClear">清除本 Day 标记</button>
  <button id="btnExport">导出进度</button>
</div>
<div id="list"></div>
<p class="foot">标记存在这个网址下本机浏览器里，下次打开还在；Safari 里“分享 → 添加到主屏幕”后就是桌面 App，标记一样在。<br>换设备需要重新标记。</p>

var MARKS = ["", "✓", "✗"];
var CLASSES = ["", "on", "no"];
var cur = DAYS.length - 1, filterMode = 0; // 默认最新 Day; 0 全部, 1 只看不会, 2 只看星标
var ORDERS = {}; // 每 Day 的显示顺序 (原下标数组), 只在当次打开时有效, 不存 localStorage
function key(day) { return "cet4-review-v1-" + day; }
function starsKey(day) { return "cet4-review-v1-" + day + "-stars"; }
function load(day) {
  var st = {};
  try { st = JSON.parse(localStorage.getItem(key(day)) || "{}"); } catch (e) { st = {}; }
  // 旧版“？”选项已取消：把残留的 3 清成未标记
  var changed = false;
  Object.keys(st).forEach(function (k) {
    st[k] = (st[k] || []).map(function (v) { if (v === 3) { changed = true; return 0; } return v; });
  });
  if (changed) { try { localStorage.setItem(key(day), JSON.stringify(st)); } catch (e) {} }
  return st;
}
function loadStars(day) {
  try { return JSON.parse(localStorage.getItem(starsKey(day)) || "{}"); } catch (e) { return {}; }
}
function saveStars(day, stars) { try { localStorage.setItem(starsKey(day), JSON.stringify(stars)); } catch (e) {} }
// 从小样迁移 Day 10 前 12 词的旧标记(小样 key: cet4-review-demo-day10)
(function migrate() {
  try {
    var old = JSON.parse(localStorage.getItem("cet4-review-demo-day10") || "null");
    if (old && !localStorage.getItem(key("Day 10"))) localStorage.setItem(key("Day 10"), JSON.stringify(old));
  } catch (e) {}
})();
function save(day, state) { try { localStorage.setItem(key(day), JSON.stringify(state)); } catch (e) {} }
function paintBox(b, v) {
  b.className = "box" + (CLASSES[v] ? " " + CLASSES[v] : "");
  b.textContent = MARKS[v];
}
// “不会”只看最后一遍的记号: 最后一格有记号的方框是 ✗ 才算不会,
// 前面错过、后面改对了就不算 (如 [✗, ✓] 不算不会, [✓, ✗] 算不会)
function lastMark(tk) {
  for (var k = 3; k >= 0; k--) { if (tk[k]) return tk[k]; }
  return 0;
}
function stats(day) {
  var dayObj = null;
  for (var di = 0; di < DAYS.length; di++) { if (DAYS[di].name === day) { dayObj = DAYS[di]; break; } }
  if (!dayObj) return { t: 0, total: 0, d: 0, m: 0, s: 0 };
  var st = load(day), stars = loadStars(day), words = dayObj.words, t = 0, d = 0, m = 0, s = 0;
  words.forEach(function (_, i) {
    var tk = st[i] || [0, 0, 0, 0], marked = 0, yes = 0, weak = false;
    tk.forEach(function (v) { if (v) marked++; if (v === 1) yes++; });
    if (lastMark(tk) === 2) weak = true;
    t += marked; if (yes === 4) d++; if (weak) m++; if (stars[i]) s++;
  });
  return { t: t, total: words.length * 4, d: d, m: m, s: s };
}
function renderProgress() {
  var s = stats(DAYS[cur].name);
  document.getElementById("pTicks").textContent = "已标记 " + s.t + " / " + s.total;
  document.getElementById("pDone").textContent = "全对 " + s.d + " 词 · 不会 " + s.m + " 词 · ★ " + s.s;
}
function renderPicker() {
  document.getElementById("curDay").textContent = DAYS[cur].name + " · " + DAYS[cur].words.length + "词";
  var panel = document.getElementById("panel");
  panel.innerHTML = "";
  DAYS.forEach(function (d, i) {
    var s = stats(d.name);
    var b = document.createElement("div");
    b.className = "daybtn" + (i === cur ? " sel" : "");
    b.innerHTML = '<div class="dn">' + d.name + '</div><div class="dp">' + d.words.length + '词 · 已标 ' + s.t + '/' + s.total + '</div>';
    b.addEventListener("click", function () {
      cur = i;
      panel.classList.remove("open");
      document.getElementById("btnPicker").textContent = "▽ 切换 Day";
      renderPicker(); renderList();
    });
    panel.appendChild(b);
  });
}
document.getElementById("btnPicker").addEventListener("click", function (ev) {
  var panel = document.getElementById("panel");
  var open = panel.classList.toggle("open");
  ev.target.textContent = open ? "△ 收起" : "▽ 切换 Day";
});
function renderList() {
  var day = DAYS[cur], st = load(day.name), stars = loadStars(day.name), list = document.getElementById("list");
  list.innerHTML = "";
  var shown = 0;
  var order = ORDERS[day.name] || day.words.map(function (_, i) { return i; });
  order.forEach(function (i) {
    var w = day.words[i];
    var tk = st[i] || [0, 0, 0, 0];
    var weak = lastMark(tk) === 2;
    if (filterMode === 1 && !weak) return;
    if (filterMode === 2 && !stars[i]) return;
    shown++;
    var card = document.createElement("div");
    card.className = "card" + (shown % 2 === 0 ? " alt" : "");
    var row = document.createElement("div");
    row.className = "word-row";
    row.innerHTML = '<span class="no">' + (i + 1) + '</span><span class="word">' + w[0] + '</span>';
    var mean = document.createElement("div");
    mean.className = "meaning"; mean.textContent = w[1];
    var ticks = document.createElement("div");
    ticks.className = "ticks";
    for (var k = 0; k < 4; k++) {
      (function (k) {
        var b = document.createElement("span");
        paintBox(b, tk[k]);
        b.addEventListener("click", function (ev) {
          ev.stopPropagation();
          var s2 = load(day.name), t2 = s2[i] || [0, 0, 0, 0];
          t2[k] = (t2[k] + 1) % 3;
          s2[i] = t2; save(day.name, s2);
          paintBox(b, t2[k]);
          renderProgress();
          if (filterMode === 1) renderList();
        });
        ticks.appendChild(b);
      })(k);
    }
    var star = document.createElement("span");
    star.className = "star" + (stars[i] ? " on" : "");
    star.textContent = stars[i] ? "★" : "☆";
    star.addEventListener("click", function (ev) {
      ev.stopPropagation();
      var ss = loadStars(day.name);
      if (ss[i]) { delete ss[i]; } else { ss[i] = 1; }
      saveStars(day.name, ss);
      star.className = "star" + (ss[i] ? " on" : "");
      star.textContent = ss[i] ? "★" : "☆";
      renderProgress();
      if (filterMode === 2) renderList();
    });
    ticks.appendChild(star);
    card.addEventListener("click", function () { card.classList.toggle("open"); });
    card.appendChild(row); card.appendChild(mean); card.appendChild(ticks);
    list.appendChild(card);
  });
  if (!shown) {
    var e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "这个筛选下没有词，<br>换个筛选条件看看吧。";
    list.appendChild(e);
  }
  renderProgress();
}
// 筛选三个状态分开成三个按钮, 点哪个就是哪个, 不用循环按
["btnF0", "btnF1", "btnF2"].forEach(function (id, f) {
  document.getElementById(id).addEventListener("click", function () {
    filterMode = f;
    ["btnF0", "btnF1", "btnF2"].forEach(function (id2, f2) {
      document.getElementById(id2).classList.toggle("on", f2 === f);
    });
    renderList();
  });
});
document.getElementById("btnShuffle").addEventListener("click", function () {
  var day = DAYS[cur], arr = day.words.map(function (_, i) { return i; });
  for (var j = arr.length - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  ORDERS[day.name] = arr;
  renderList();
});
document.getElementById("btnRestore").addEventListener("click", function () {
  delete ORDERS[DAYS[cur].name];
  renderList();
});
document.getElementById("btnHide").addEventListener("click", function () {
  document.querySelectorAll(".card.open").forEach(function (c) { c.classList.remove("open"); });
});
document.getElementById("btnClear").addEventListener("click", function () {
  save(DAYS[cur].name, {});
  saveStars(DAYS[cur].name, {});
  renderList();
});
// 导出进度: 把当前 Day 的统计 + 不会词 + 星标词整理成一段文字, 复制到剪贴板,
// 本人发给 Muse 后 Muse 才能知道他的对错情况 (标记本身只存在他手机本地, Muse 看不到)
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
document.getElementById("btnExport").addEventListener("click", function (ev) {
  var day = DAYS[cur], st = load(day.name), stars = loadStars(day.name), s = stats(day.name);
  var weak = [], starred = [];
  day.words.forEach(function (w, i) {
    var tk = st[i] || [0, 0, 0, 0];
    if (lastMark(tk) === 2) weak.push(w[0]);
    if (stars[i]) starred.push(w[0]);
  });
  var text = "【" + day.name + " 复习进度】\n" +
    "已标记 " + s.t + " / " + s.total + " · 全对 " + s.d + " 词 · 不会 " + s.m + " 词 · 星标 " + s.s + " 个\n" +
    "不会：" + (weak.length ? weak.join("、") : "无") + "\n" +
    "星标：" + (starred.length ? starred.join("、") : "无");
  var btn = ev.target;
  function done() {
    var old = btn.textContent;
    btn.textContent = "已复制！";
    setTimeout(function () { btn.textContent = old; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
  } else {
    fallbackCopy(text); done();
  }
});
renderPicker();
renderList();
